<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記憶力じゃんけん</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="app">
    <header class="hero">
      <h1>記憶じゃんけん</h1>
      <p>出した手を覚えて、過去の自分に勝とう</p>
    </header>

    <section class="panel rule-panel" aria-live="polite">
      <h2>現在のルール:勝負<span id = "playCount">1回目</span></h2>
      <p id="ruleMessage">まずはコンピューターと勝負しよう</p>
    </section>

    <section class="panel result-panel">
      <p id="resultMessage" class="result-message">手を選んでね</p>
      <div class="result-detail">
        <p>あなた: <span id="playerHand">-</span></p>
        <p>コンピューター: <span id="computerHand">-</span></p>
      </div>
      <span id="memoryMessage" class="memory-message">11回目からは自分との勝負！</span>
    </section>

    <section class="hands">
      <button class="hand-button hand-rock" type="button">
        <span class="hand-icon">✊</span>
        <span>グー</span>
      </button>
      <button class="hand-button hand-scissors" type="button">
        <span class="hand-icon">✌️</span>
        <span>チョキ</span>
      </button>
      <button class="hand-button hand-paper" type="button">
        <span class="hand-icon">✋</span>
        <span>パー</span>
      </button>
    </section>
    <section class="reset reset-area">
      <button class="reset reset-button" type="button">
        <span>勝負回数リセット</span>
      </button>
    </section>
